name: Build PDFs

on:
  push:
    paths:
      - "main.tex"
      - "chapter*.tex"
      - "Homework/MAT5210 HW7.tex"
      - ".github/workflows/build-pdf.yml"

permissions:
  contents: write

concurrency:
  group: build-course-pdfs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile course notes
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Prepare Homework 7 filename
        shell: bash
        run: cp "Homework/MAT5210 HW7.tex" Homework/HW7.tex

      - name: Compile Homework 7
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Homework/HW7.tex

      - name: Update PDFs
        shell: bash
        run: |
          cp main.pdf MAT5210___Galois_Theory_and_Algebraic_Number_Theory.pdf
          cp Homework/HW7.pdf Homework/5210_HW7.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MAT5210___Galois_Theory_and_Algebraic_Number_Theory.pdf Homework/5210_HW7.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update compiled course PDFs"
          git push
